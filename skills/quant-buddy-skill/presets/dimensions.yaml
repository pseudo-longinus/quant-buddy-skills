    selection:
      as_of: 20260826
      ready: true
      vector_type: score
    source_name: 昨日跌停延续与修复
    window: 60
  - asset_scope:
      - A股
    calculation: '`(开盘上涨家数-开盘下跌家数)/(两者合计)`，权重5%'
