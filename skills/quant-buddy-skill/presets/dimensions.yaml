    dimension: 财务爆雷风险
    asset_scope:
      - A股
    indicator_type: 细分
    output_type: score
    description: 高分表示并购溢价高且主业利润率走弱，未来减值弹性大
    calculation: 商誉主体风险 ×（70% + 核心利润率同比下滑风险30%）；商誉主体由商誉/权益57%和商誉/资产43%构成
  - indicator_id: A股_利润洗澡风险得分
    name: A股利润洗澡风险
    dimension: 财务爆雷风险
    asset_scope:
