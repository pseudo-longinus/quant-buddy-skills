# ============================================================
# 千维 · 选股维度目录（由 qw_indicator / qw_dimension 导出）
#
# indicator_id = qw_indicator.ind_id（优先）/ code；selectByComposition 直接用它查库
# direction    = 服务端元数据方向；请求不可覆盖
# indicator_type = 细分 / 综合；两者均可参与选股
# output_type    = score 用于加权排序，screen 用于集合筛选
# selection      = 物化选股状态；仅导出 selection.ready=true 的指标，as_of 为快照日
# asset_scope    = 用于校验该指标是否支持用户请求市场
# ============================================================
A股_个股情绪:
  - asset_scope:
      - A股
    calculation: 价格反馈30%+参与确认20%+资金方向20%+相对需求15%+异常反馈10%+龙虎榜资金方向5%；前一交易日无上榜事件时动态归一
    description: 正值表示行为代理的净情绪偏积极，负值表示偏消极；0表示无明确净方向，不等同于必然平静
    dimension: 个股情绪
    direction: high_bullish
    indicator_id: ind_a_share_b2c71b60
    indicator_type: 综合
    name: A股_个股情绪维度分
    output_type: score
    selection:
      as_of: 20260826
      ready: true
      vector_type: score
    source_name: A股_个股情绪维度分
    window: 20
  - asset_scope:
      - A股
    calculation: 隔夜跳空方向强度20%+日内承接25%+近5日涨跌平衡25%+5日收益方向强度30%
    description: 正值表示短周期价格反馈偏积极，负值表示偏消极；高开继续上涨或低开继续下跌会同向确认，高开回落或低开修复会相互抵消
    dimension: 个股情绪
    direction: high_bullish
    indicator_id: ind_a_share_705da8d0
    indicator_type: 细分
    name: A股_价格反馈
    output_type: score
    selection:
      as_of: 20260826
      ready: true
      vector_type: score
    source_name: A股_价格反馈
    window: 5
  - asset_scope:
      - A股
    calculation: 近5日量价方向×参与强度；参与强度为成交额量比40%+短期放量30%+换手爆量30%
    description: 正值表示上涨方向获得更强交易参与，负值表示下跌方向获得更强参与；低参与会压低贡献
    dimension: 个股情绪
    direction: high_bullish
    indicator_id: ind_a_share_6aa3b11b
    indicator_type: 细分
    name: A股_参与确认
    output_type: score
    selection:
      as_of: 20260826
      ready: true
      vector_type: score
    source_name: A股_参与确认
    window: 20
  - asset_scope:
      - A股
    calculation: 当日极端反馈70%+极端持续方向30%；当日极端反馈在收盘涨停/跌停时为1/-1，否则取维度15有符号价格偏离异动评分；2至5日连续涨跌停状态按40%/30%/20%/10%累积极端持续方向
    description: 正值表示向上极端反馈，负值表示向下极端反馈；首次涨跌停的异常反馈绝对值为0.7，2/3/4/5日及以上连续涨跌停时绝对值依次为0.82/0.91/0.97/1
    dimension: 个股情绪
    direction: high_bullish
    indicator_id: ind_a_share_6efb77b9
    indicator_type: 细分
    name: A股_异常反馈
    output_type: score
    selection:
      as_of: 20260826
      ready: true
      vector_type: score
    source_name: A股_异常反馈
    window: 5
  - asset_scope:
      - A股
    calculation: 相对市场35%+行业相对排名持续性40%+跑赢沪深300稳定性25%，围绕自然中点0.5居中
    description: 正值表示相对市场或行业需求偏强，负值表示相对偏弱；不代表绝对收益必然同方向
    dimension: 个股情绪
    direction: high_bullish
    indicator_id: ind_a_share_e072759a
    indicator_type: 细分
    name: A股_相对需求
    output_type: score
    selection:
      as_of: 20260826
      ready: true
      vector_type: score
    source_name: A股_相对需求
    window: 20
  - asset_scope:
      - A股
    calculation: 主力资金净占比符号×绝对净占比横截面强度
    description: 主力净流入为正、净流出为负，绝对影响越大强度越高
    dimension: 个股情绪
    direction: high_bullish
    indicator_id: ind_a_share_453a2fcf
    indicator_type: 细分
    name: A股_资金方向
    output_type: score
    selection:
      as_of: 20260826
      ready: true
      vector_type: score
    source_name: A股_资金方向
    window: 1
  - asset_scope:
      - A股
    calculation: 前一交易日的日榜和三日榜有符号净主导比例按75%和25%合成；前一交易日未上榜时为0且5%权重退出有效分母
    description: 正值表示最新已披露榜单中的资金净主导偏正，负值表示偏负；上榜原因健康和拉萨系拥挤不负责定向
    dimension: 个股情绪
    direction: high_bullish
    indicator_id: ind_a_share_711ea03c
    indicator_type: 细分
    name: A股_龙虎榜资金方向
    output_type: score
    selection:
      as_of: 20260826
      ready: true
      vector_type: score
    source_name: A股_龙虎榜资金方向
    window: 3
