    indicator_id: ind_a_share_financial_blowup_warning_composite
    name: A股财务爆雷风险
    output_type: score
    source_name: A股财务爆雷风险
    window: 360
A股_资金流向:
  - asset_scope:
      - A股
    calculation: 当日主力净流入30%、昨日以前3日主力持续30%、行业内主力40%
