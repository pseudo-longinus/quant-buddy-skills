    source_name: 昨日涨停赚钱效应
    window: 60
  - asset_scope:
      - A股
    calculation: 继续跌停率反向、红盘修复率正向，各占50%，权重5%
    description: 高分表示昨日跌停股延续风险较低、修复较强
    dimension: 市场情绪
    direction: high_bullish
    indicator_id: ind_a_share_prior_limit_down_followthrough_repair
