    indicator_id: ind_a_share_limit_up_down_breadth
    indicator_type: 细分
    name: 收盘涨跌停广度
    output_type: score
    selection:
      as_of: 20260826
      ready: true
      vector_type: score
    source_name: 收盘涨跌停广度
    window: 1
  - asset_scope:
      - A股
