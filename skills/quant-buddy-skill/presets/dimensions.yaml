A股_市场情绪:
  - asset_scope:
      - A股
    calculation: 8项指标按25%/15%/15%/15%/15%/5%/5%/5%固定权重直接加权求和；不可用分项按0贡献，权重不向其他分项转移
    description: 正值表示行业或指数市场情绪偏积极，负值表示偏消极；有效证据减少时绝对值向0收缩
    dimension: 市场情绪
    direction: high_bullish
    indicator_id: ind_a_share_market_sentiment
    indicator_type: 综合
    name: A股市场情绪
    output_type: score
    selection:
      as_of: 20260826
      ready: true
      vector_type: score
    source_name: A股市场情绪
    window: 60
  - asset_scope:
      - A股
    calculation: 两板以上家数/收盘涨停家数，转60日历史水位，权重5%
    description: 高分表示连续两日涨停样本在涨停结构中的占比较高
    dimension: 市场情绪
    direction: high_bullish
    indicator_id: ind_a_share_three_board_plus_expansion
    indicator_type: 细分
    name: 两板以上扩散
    output_type: score
    selection:
      as_of: 20260826
      ready: true
      vector_type: score
    source_name: 两板以上扩散
    window: 60
  - asset_scope:
      - A股
    calculation: 收盘涨停家数/盘中触板家数，转60日历史水位，权重15%
    description: 高分表示盘中触板后收盘封住的比例处于较高历史水位
    dimension: 市场情绪
