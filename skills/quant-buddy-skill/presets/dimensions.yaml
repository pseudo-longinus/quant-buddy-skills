# ============================================================
# 千维 · 选股维度目录（由 qw_indicator / qw_dimension 导出）
#
# indicator_id = qw_indicator.ind_id（优先）/ code；selectByComposition 直接用它查库
# direction    = 服务端元数据方向；请求不可覆盖
# output_type  = score 用于加权排序，screen 用于集合筛选
# asset_scope  = v1 用于校验该指标是否支持用户请求市场
# ============================================================
A股_个股情绪:
  - asset_scope:
      - A股
    calculation: 价格反馈30%+参与确认20%+资金方向20%+相对需求15%+异常反馈10%+龙虎榜资金方向5%；前一交易日无上榜事件时动态归一
    description: 正值表示行为代理的净情绪偏积极，负值表示偏消极；0表示无明确净方向，不等同于必然平静
    dimension: 个股情绪
    direction: high_bullish
    indicator_id: ind_a_share_b2c71b60
    name: A股_个股情绪维度分
    output_type: score
    source_name: A股_个股情绪维度分
    window: 20
A股_估值性价比:
  - asset_scope:
      - A股
    calculation: PE估值吸引力30%、PB估值吸引力25%、PS收入估值吸引力20%、股息率25%
    description: 高分表示估值和股息回报更有吸引力；无效分项按0贡献，固定权重不转移
    dimension: 估值性价比
    direction: high_bullish
    indicator_id: ind_a_share_valuation_composite
    name: A股估值性价比
    output_type: score
    source_name: A股估值性价比
    window: 250
A股_动量与反转:
  - asset_scope:
      - A股
    calculation: 5日10%、6至20日35%、21至60日25%、加速度15%、RSI健康15%，再乘拥挤修正
    description: A股动量与反转最终得分
    dimension: 动量与反转
    direction: high_bullish
    indicator_id: ind_a_share_momentum_reversal
    name: A股_动量与反转
    output_type: score
    source_name: A股_动量与反转
    window: 60
A股_市场情绪:
  - asset_scope:
      - A股
    calculation: 8项指标按25%/15%/15%/15%/15%/5%/5%/5%固定权重直接加权求和；不可用分项按0贡献，权重不向其他分项转移
    description: 正值表示行业或指数市场情绪偏积极，负值表示偏消极；有效证据减少时绝对值向0收缩
    dimension: 市场情绪
    direction: high_bullish
    indicator_id: ind_a_share_market_sentiment
    name: A股市场情绪
    output_type: score
    source_name: A股市场情绪
    window: 60
A股_异动监控:
  - asset_scope:
      - A股
    calculation: 10日偏离+100%/-50%、30日偏离+200%/-70%，或10日内多次同向异常波动
    description: 1表示进入严重异动监控口径
    dimension: 异动监控
    direction: high_bullish
    indicator_id: ind_a_share_severe_abnormal_volatility
    name: 严重异常波动
    output_type: screen
    source_name: 严重异常波动
    window: 30
  - asset_scope:
      - A股
    calculation: 3日内价格偏离异动、3日内换手异动、严重异常波动三者取并集
    description: 1表示该股当日进入交易异动监控名单，已包含严重异常波动
    dimension: 异动监控
    direction: high_bullish
    indicator_id: ind_a_share_daily_trading_abnormal
    name: 当日交易异动
    output_type: screen
    source_name: 当日交易异动
    window: 1
  - asset_scope:
      - A股
    calculation: 价格偏离强度65% + 换手爆量强度35%，方向由价格偏离决定
    description: 交易员可直接按绝对值看异动强度，按正负看异动方向
    dimension: 异动监控
    direction: high_bullish
    indicator_id: ind_a_share_daily_abnormal_score
    name: 当日异动评分
    output_type: score
    source_name: 当日异动评分
    window: 1
A股_形态_波动与风控:
  - asset_scope:
      - A股
    calculation: 历史波动率适中15%、布林收口后开口15%、均线偏离健康20%、60日回撤控制20%、回踩企稳15%、跳空健康15%；再乘跌停流动性健康修正
    description: A股形态健康最终得分，跌停时归零以保持综合分越高越健康
    dimension: 形态、波动与风控
    direction: high_bullish
    indicator_id: ind_a_share_pattern_health
    name: A股形态健康
    output_type: score
    source_name: A股形态健康
    window: 250
A股_现金流质量:
  - asset_scope:
      - A股
    calculation: CFO净利润比30%、CFO收入比20%、应计项资产比20%、FCF资产比15%、FCF收益率15%；分项缺失按0贡献，固定权重不转移
    description: 高分表示盈利质量和现金创造能力更好；数据不完整会保守压低维度分
    dimension: 现金流质量
    direction: high_bullish
    indicator_id: ind_a_share_cashflow_quality_composite
    name: A股现金流质量
    output_type: score
    source_name: A股现金流质量
    window: 90
A股_盈利成长:
  - asset_scope:
      - A股
    calculation: 营收同比35%、归母净利润同比40%、CFO同比25%
    description: 高分表示收入、利润和现金流同步增长；缺失分项按0贡献，固定权重不转移
    dimension: 盈利成长
    direction: high_bullish
    indicator_id: ind_a_share_earnings_growth_composite
    name: A股盈利成长
    output_type: score
    source_name: A股盈利成长
    window: 90
A股_盈利能力:
  - asset_scope:
      - A股
    calculation: ROE25%、ROA20%、毛利率20%、净利率20%、营业利润率15%
    description: 高分表示公司赚钱能力更强；缺失分项按0贡献，固定权重不转移
    dimension: 盈利能力
    direction: high_bullish
    indicator_id: ind_a_share_profitability_composite
    name: A股盈利能力
    output_type: score
    source_name: A股盈利能力
    window: 90
A股_相对强度:
  - asset_scope:
      - A股
    calculation: 信息比率35%、行业排名持续性40%、跑赢基准稳定性25%
    description: A股相对强度最终得分
    dimension: 相对强度
    direction: high_bullish
    indicator_id: ind_a_share_relative_strength
    name: A股相对强度
    output_type: score
    source_name: A股相对强度
    window: 20
A股_财务安全:
  - asset_scope:
      - A股
    calculation: 资产负债率安全35%、流动比率安全20%、速动比率安全15%、现金短债比安全30%；分项缺失按0贡献，固定权重不转移
    description: 高分表示资产负债表和流动性更安全；数据不完整会保守压低维度分
    dimension: 财务安全
    direction: high_bullish
    indicator_id: ind_a_share_financial_safety_composite
    name: A股财务安全
    output_type: score
    source_name: A股财务安全
    window: 90
A股_财务爆雷风险:
  - asset_scope:
      - A股
    calculation: 应收异常10%、存货异常10%、核心利润获现不足10%、纸面富贵组合强度10%、存贷双高15%、商誉黑洞15%、利润洗澡10%、其他应收占用8%、在建工程异常7%、近4期亏损频次5%
    description: 高分表示多项张氏排雷信号形成风险闭环
    dimension: 财务爆雷风险
