    name: A股核心利润获现不足
    dimension: 财务爆雷风险
    asset_scope:
      - A股
    indicator_type: 细分
    output_type: score
    description: 高分表示正的核心利润难以变成经营现金流；分母非正时该分项不计算
    calculation: 1 - 核心利润获现率横截面排序；仅当核心利润+其他收益大于0时计算CFO/(核心利润+其他收益)
  - indicator_id: A股_纸面富贵预警得分
    name: A股纸面富贵预警
    dimension: 财务爆雷风险
    asset_scope:
      - A股
    indicator_type: 细分
    output_type: score
    description: 高分表示利润表改善，但经营现金流与营运资本不配合，形成组合异常
    calculation: 核心利润为正且同比改善 × 核心利润获现不足 × 应收或存货异常
  - indicator_id: A股_存贷双高冲突得分
    name: A股存贷双高冲突
    dimension: 财务爆雷风险
    asset_scope:
      - A股
    indicator_type: 细分
    output_type: score
    description: 高分表示“账上有钱还大额借钱”的常识冲突，需排查受限资金、资金占用或虚构货币资金
    calculation: 货币资金/资产高 × 有息负债/资产高，并用财务费用压力修正
