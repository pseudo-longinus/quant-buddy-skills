# 千维计划：维度与指标认知参考
# 参考日期：2026-11-24；来源：新计算平台 owner_key=qw 的公式组及成员 extras。
# 用途：帮助 Agent 理解业务维度、指标含义并直接检索候选；命中后可直接用 indicator_id（或 name）调用 fast_query（历史快照/历史序列）、查公式或选股。
# 仅在本地未命中、需查最新新增指标/实时状态，或调用报 INDICATOR_NOT_FOUND 时，再调 listDimensionIndicators 在线确认。
# 完整 indicator_id 或上游明确别名用于 fast_query / 查公式 / 选股；direction 由服务端使用默认值。
# 新增或变更以在线目录为准；本文件未收录的指标也可在线发现和调用。
# skill_server 随用随取上游信息，不读取本文件；本参考不保存数值、日期状态或旧 ID 映射。
# 本次参考包含 18 个业务维度、50 个市场分组、325 项指标。
# 业务维度：个股情绪、市场情绪、异动监控、龙虎榜资金席位、期货供需、财务爆雷风险、运营效率、财务安全、现金流质量、盈利成长、盈利能力、估值性价比、形态、波动与风控、资金流向、量能与流动性、相对强度、动量与反转、趋势结构
个股情绪维度 · 美股:
  - indicator_id: 美股_价格反馈
    name: 美股_价格反馈
    dimension: 个股情绪
    asset_scope:
      - 美股
    indicator_type: 细分
    output_type: score
    description: 正值表示短周期价格反馈偏积极，负值表示偏消极；高开继续上涨或低开继续下跌会同向确认，高开回落或低开修复会相互抵消
    calculation: 隔夜跳空方向强度20%+日内承接25%+近5日涨跌平衡25%+5日收益方向强度30%
  - indicator_id: 美股_参与确认
    name: 美股_参与确认
    dimension: 个股情绪
    asset_scope:
      - 美股
    indicator_type: 细分
    output_type: score
    description: 正值表示上涨方向获得更强交易参与，负值表示下跌方向获得更强参与；低参与会压低贡献
    calculation: 近5日量价方向×参与强度；参与强度为成交额量比60%+短期放量40%
  - indicator_id: 美股_相对需求
    name: 美股_相对需求
    dimension: 个股情绪
    asset_scope:
      - 美股
    indicator_type: 细分
    output_type: score
    description: 正值表示相对市场需求偏强，负值表示相对偏弱；不代表绝对收益必然同方向
    calculation: 20日市场相对持续性45%+21至60日持续性35%+20日领先稳定性20%，围绕自然中点0.5居中
  - indicator_id: 美股_情绪测量置信度
    name: 美股_情绪测量置信度
    dimension: 个股情绪
    asset_scope:
      - 美股
    indicator_type: 细分
    output_type: score
    description: 1表示当前方向分有连续成交、足够成交额和较低价格冲击支持；低分只缩小方向强度，不代表消极情绪
    calculation: 近20日交易连续性40%+成交额活跃度30%+低冲击流动性30%
  - indicator_id: 美股_个股情绪维度分
    name: 美股_个股情绪维度分
    dimension: 个股情绪
    asset_scope:
      - 美股
    indicator_type: 综合
    output_type: score
    description: 正值表示行为代理的净情绪偏积极，负值表示偏消极；0表示无明确净方向或当前测量置信度很低，不等同于必然平静
    calculation: 价格反馈45%+参与确认30%+相对需求25%，再乘情绪测量置信度
个股情绪维度 · 港股:
  - indicator_id: 港股_价格反馈
    name: 港股_价格反馈
    dimension: 个股情绪
    asset_scope:
      - 港股
    indicator_type: 细分
    output_type: score
    description: 正值表示短周期价格反馈偏积极，负值表示偏消极；高开继续上涨或低开继续下跌会同向确认，高开回落或低开修复会相互抵消
    calculation: 隔夜跳空方向强度20%+日内承接25%+近5日涨跌平衡25%+5日收益方向强度30%
  - indicator_id: 港股_参与确认
    name: 港股_参与确认
    dimension: 个股情绪
    asset_scope:
      - 港股
    indicator_type: 细分
    output_type: score
    description: 正值表示上涨方向获得更强交易参与，负值表示下跌方向获得更强参与；低参与会压低贡献
    calculation: 近5日量价方向×参与强度；参与强度为成交额量比60%+短期放量40%
  - indicator_id: 港股_相对需求
    name: 港股_相对需求
    dimension: 个股情绪
    asset_scope:
      - 港股
    indicator_type: 细分
    output_type: score
    description: 正值表示相对市场或行业需求偏强，负值表示相对偏弱；不代表绝对收益必然同方向
    calculation: 相对市场35%+行业相对排名持续性40%+跑赢恒生综指稳定性25%，围绕自然中点0.5居中
  - indicator_id: 港股_南向持股方向
    name: 港股_南向持股方向
    dimension: 个股情绪
    asset_scope:
      - 港股
    indicator_type: 细分
    output_type: score
    description: 正值表示南向持股比例增加，负值表示减少；0表示持股比例真实未变，不等同于无数据
    calculation: 5日南向持股比例变化的符号×绝对变化横截面强度；字段无覆盖或变化无法计算时按0贡献，其余模块权重不放大
  - indicator_id: 港股_情绪测量置信度
    name: 港股_情绪测量置信度
    dimension: 个股情绪
    asset_scope:
      - 港股
    indicator_type: 细分
    output_type: score
    description: 1表示当前方向分有连续成交、足够成交额和较低价格冲击支持；低分只缩小方向强度，不代表消极情绪
    calculation: 近20日交易连续性40%+成交额活跃度30%+低冲击流动性30%
  - indicator_id: 港股_个股情绪维度分
    name: 港股_个股情绪维度分
    dimension: 个股情绪
    asset_scope:
      - 港股
    indicator_type: 综合
    output_type: score
    description: 正值表示行为代理的净情绪偏积极，负值表示偏消极；0表示无明确净方向或当前测量置信度很低，不等同于必然平静
    calculation: 价格反馈40.5%+参与确认27%+相对需求22.5%+南向持股方向10%；南向不可用时按0贡献且固定权重不转移，再乘情绪测量置信度
个股情绪维度 · A股:
  - indicator_id: A股_价格反馈
    name: A股_价格反馈
    dimension: 个股情绪
    asset_scope:
      - A股
    indicator_type: 细分
    output_type: score
    description: 正值表示短周期价格反馈偏积极，负值表示偏消极；高开继续上涨或低开继续下跌会同向确认，高开回落或低开修复会相互抵消
    calculation: 隔夜跳空方向强度20%+日内承接25%+近5日涨跌平衡25%+5日收益方向强度30%
  - indicator_id: A股_参与确认
    name: A股_参与确认
    dimension: 个股情绪
    asset_scope:
      - A股
    indicator_type: 细分
    output_type: score
    description: 正值表示上涨方向获得更强交易参与，负值表示下跌方向获得更强参与；低参与会压低贡献
    calculation: 近5日量价方向×参与强度；参与强度为成交额量比40%+短期放量30%+换手爆量30%
  - indicator_id: A股_资金方向
    name: A股_资金方向
    dimension: 个股情绪
    asset_scope:
      - A股
    indicator_type: 细分
    output_type: score
    description: 主力净流入为正、净流出为负，绝对影响越大强度越高
    calculation: 主力资金净占比符号×绝对净占比横截面强度
  - indicator_id: A股_相对需求
    name: A股_相对需求
    dimension: 个股情绪
    asset_scope:
      - A股
    indicator_type: 细分
    output_type: score
    description: 正值表示相对市场或行业需求偏强，负值表示相对偏弱；不代表绝对收益必然同方向
    calculation: 相对市场35%+行业相对排名持续性40%+跑赢沪深300稳定性25%，围绕自然中点0.5居中
  - indicator_id: A股_异常反馈
    name: A股_异常反馈
    dimension: 个股情绪
    asset_scope:
      - A股
    indicator_type: 细分
    output_type: score
    description: 正值表示向上极端反馈，负值表示向下极端反馈；首次涨跌停的异常反馈绝对值为0.7，2/3/4/5日及以上连续涨跌停时绝对值依次为0.82/0.91/0.97/1
    calculation: 当日极端反馈70%+极端持续方向30%；当日极端反馈在收盘涨停/跌停时为1/-1，否则取维度15有符号价格偏离异动评分；2至5日连续涨跌停状态按40%/30%/20%/10%累积极端持续方向
  - indicator_id: A股_龙虎榜资金方向
    name: A股_龙虎榜资金方向
    dimension: 个股情绪
    asset_scope:
      - A股
    indicator_type: 细分
    output_type: score
    description: 正值表示最新已披露榜单中的资金净主导偏正，负值表示偏负；上榜原因健康和拉萨系拥挤不负责定向
    calculation: 前一交易日的日榜和三日榜有符号净主导比例按75%和25%合成；前一交易日未上榜时为0且5%权重退出有效分母
  - indicator_id: A股_个股情绪维度分
    name: A股_个股情绪维度分
    dimension: 个股情绪
    asset_scope:
      - A股
    indicator_type: 综合
    output_type: score
    description: 正值表示行为代理的净情绪偏积极，负值表示偏消极；0表示无明确净方向，不等同于必然平静
    calculation: 价格反馈30%+参与确认20%+资金方向20%+相对需求15%+异常反馈10%+龙虎榜资金方向5%；前一交易日无上榜事件时动态归一
市场情绪维度 · A股:
  - indicator_id: A股_涨跌家数广度分
    name: 涨跌家数广度
    dimension: 市场情绪
    asset_scope:
      - A股
    indicator_type: 细分
    output_type: score
    description: 正值表示上涨家数占优，负值表示下跌家数占优
    calculation: "`(上涨家数-下跌家数)/(上涨家数+下跌家数)`，权重25%"
  - indicator_id: A股_涨跌停广度分
    name: 收盘涨跌停广度
    dimension: 市场情绪
    asset_scope:
      - A股
    indicator_type: 细分
    output_type: score
    description: 正值表示涨停相对占优，负值表示跌停相对占优
    calculation: "`(收盘涨停家数-收盘跌停家数)/(两者合计)`，权重15%"
  - indicator_id: A股_封板承接方向分
    name: 封板承接
    dimension: 市场情绪
    asset_scope:
      - A股
    indicator_type: 细分
    output_type: score
    description: 高分表示盘中触板后收盘封住的比例处于较高历史水位
    calculation: 收盘涨停家数/盘中触板家数，转60日历史水位，权重15%
  - indicator_id: A股_晋级方向分
    name: 昨日涨停晋级
    dimension: 市场情绪
    asset_scope:
      - A股
    indicator_type: 细分
    output_type: score
    description: 高分表示昨日涨停股继续晋级的比例较高
    calculation: 今日继续涨停家数/昨日涨停有效基数，转60日历史水位，权重15%
  - indicator_id: A股_赚钱效应方向分
    name: 昨日涨停赚钱效应
    dimension: 市场情绪
    asset_scope:
      - A股
    indicator_type: 细分
    output_type: score
    description: 高分表示昨日涨停样本今日赚钱效应更强
    calculation: 昨日涨停股今日红盘率与平均收益各占50%，权重15%
  - indicator_id: A股_跌停反馈方向分
    name: 昨日跌停延续与修复
    dimension: 市场情绪
    asset_scope:
      - A股
    indicator_type: 细分
    output_type: score
    description: 高分表示昨日跌停股延续风险较低、修复较强
    calculation: 继续跌停率反向、红盘修复率正向，各占50%，权重5%
  - indicator_id: A股_高板扩散方向分
    name: 两板以上扩散
    dimension: 市场情绪
    asset_scope:
      - A股
    indicator_type: 细分
    output_type: score
    description: 高分表示连续两日涨停样本在涨停结构中的占比较高
    calculation: 两板以上家数/收盘涨停家数，转60日历史水位，权重5%
  - indicator_id: A股_开盘广度分
    name: 正式开盘广度
    dimension: 市场情绪
    asset_scope:
      - A股
    indicator_type: 细分
    output_type: score
    description: 正值表示正式开盘上涨家数占优；不代表9:25集合竞价广度
    calculation: "`(开盘上涨家数-开盘下跌家数)/(两者合计)`，权重5%"
  - indicator_id: A股_市场情绪维度分
    name: A股市场情绪
    dimension: 市场情绪
    asset_scope:
      - A股
    indicator_type: 综合
    output_type: score
    description: 正值表示行业或指数市场情绪偏积极，负值表示偏消极；有效证据减少时绝对值向0收缩
    calculation: 8项指标按25%/15%/15%/15%/15%/5%/5%/5%固定权重直接加权求和；不可用分项按0贡献，权重不向其他分项转移
异动监控维度 · A股:
  - indicator_id: A股_3日内价格偏离异动
    name: 3日内价格偏离异动
    dimension: 异动监控
    asset_scope:
      - A股
    indicator_type: 细分
    output_type: screen
    description: 1表示触发价格偏离异动
    calculation: 个股相对对应指数的累计涨跌幅偏离值，主板阈值20%，创业板/科创板阈值30%
  - indicator_id: A股_严重异常波动
    name: 严重异常波动
    dimension: 异动监控
    asset_scope:
      - A股
    indicator_type: 综合
    output_type: screen
    description: 1表示进入严重异动监控口径
    calculation: 10日偏离+100%/-50%、30日偏离+200%/-70%，或10日内多次同向异常波动
  - indicator_id: A股_3日内换手异动
    name: 3日内换手异动
    dimension: 异动监控
    asset_scope:
      - A股
    indicator_type: 细分
    output_type: screen
    description: 1表示换手突然放大到交易所异动口径
    calculation: 主板交易所换手异动口径：任一窗口日均换手率/前5日日均换手率≥30，且窗口累计换手率≥20%
  - indicator_id: A股_价格偏离异动评分
    name: 价格偏离异动评分
    dimension: 异动监控
    asset_scope:
      - A股
    indicator_type: 细分
    output_type: score
    description: 正值表示向上异动，负值表示向下异动，绝对值越大越异常
    calculation: 最大绝对偏离值/适用阈值，再同市场横截面分位；符号由最大偏离窗口方向决定
  - indicator_id: A股_换手爆量评分
    name: 换手爆量评分
    dimension: 异动监控
    asset_scope:
      - A股
    indicator_type: 细分
    output_type: score
    description: 越接近1表示换手越异常、越拥挤
    calculation: 换手倍率对数分位与累计换手分位几何合成
  - indicator_id: A股_当日异动评分
    name: 当日异动评分
    dimension: 异动监控
    asset_scope:
      - A股
    indicator_type: 综合
    output_type: score
    description: 交易员可直接按绝对值看异动强度，按正负看异动方向
    calculation: 价格偏离强度65% + 换手爆量强度35%，方向由价格偏离决定
  - indicator_id: A股_当日交易异动
    name: 当日交易异动
    dimension: 异动监控
    asset_scope:
      - A股
    indicator_type: 综合
    output_type: screen
    description: 1表示该股当日进入交易异动监控名单，已包含严重异常波动
    calculation: 3日内价格偏离异动、3日内换手异动、严重异常波动三者取并集
龙虎榜资金席位维度 · A股:
  - indicator_id: A股_龙虎榜上榜标识
    name: 龙虎榜上榜事件
    dimension: 龙虎榜资金席位
    asset_scope:
      - A股
    indicator_type: 细分
    output_type: screen
    description: 1表示识别为日榜或三日榜龙虎榜上榜事件；用于独立事件筛选及跨维度引用，不参与本维度80%/20%加权
    calculation: 日榜原因掩码或三日榜原因掩码命中，并与A股基础可用池对齐
  - indicator_id: A股_龙虎榜资金方向得分
    name: 榜上资金方向
    dimension: 龙虎榜资金席位
    asset_scope:
      - A股
    indicator_type: 细分
    output_type: score
    description: 0.5为净主导中性，0.5以上表示净买，0.5以下表示净卖，距0.5越远表示方向越强
    calculation: 七个互斥闭合资金组净主导比例在日榜、三日榜内分别加总；绝对值排序表示强度，原值符号表示净买卖方向，再按日榜70%、三日榜30%动态归一；占维度分80%
  - indicator_id: A股_龙虎榜席位方向一致性得分
    name: 席位方向一致性
    dimension: 龙虎榜资金席位
    asset_scope:
      - A股
    indicator_type: 细分
    output_type: score
    description: 0.5表示无同向确认；两类席位共同净买时高于0.5，共同净卖时低于0.5
    calculation: 机构北向席位与营业部席位同为净买或同为净卖时，以两者较弱一侧的绝对强度形成同向确认；方向相反或任一侧为零时取中性，再按日榜70%、三日榜30%动态归一；占维度分20%
  - indicator_id: A股_龙虎榜资金席位维度分
    name: A股龙虎榜资金席位
    dimension: 龙虎榜资金席位
    asset_scope:
      - A股
    indicator_type: 综合
    output_type: score
